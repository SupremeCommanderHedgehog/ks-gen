name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# step-security/harden-runner runs in `block` mode below — outbound
# traffic is restricted to the explicit allowlist per job. The allowlist
# was derived from what each step actually needs:
#   - stepsecurity.io endpoints   : harden-runner telemetry
#   - github.com / api.github.com : actions/checkout
#   - codeload.github.com         : actions/checkout tarball fallback
#   - objects.githubusercontent.com : setup-python binary download
#   - pypi.org / files.pythonhosted.org : pip install
#   - results-receiver.actions.githubusercontent.com : actions cache + upload-artifact
#   - release-assets.githubusercontent.com : actionlint release tarball (ruff job)
# If a step fails because a host isn't allowlisted, add it here.
# codeql.yml and release-please.yml still run in audit mode — they have
# wider network needs and can be tightened separately.

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: none
      checks: none
      id-token: none
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            prod.app-api.stepsecurity.io:443
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Install via [dev] so this job uses the same ruff version
      # pyproject.toml pins for the matrix `test` job — no version skew.
      - name: Install dev extras
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests
      # Workflow files are only validated by GitHub when it tries to run them,
      # and a rejected file fails silently: ssg-drift.yml never ran once
      # between #92 and #109. Lint them here so that fails a PR instead.
      # Pinned tarball + sha256 rather than actionlint-py, which ships no
      # wheel and fetches the binary at build time.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: none
      checks: none
      id-token: none
    strategy:
      fail-fast: false
      matrix:
        # One version: the requires-python floor, so CI proves the minimum
        # ks-gen claims (AlmaLinux 10's system Python). Kept as a matrix of
        # one so the required check stays named `test (3.12)`.
        python: ["3.12"]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            prod.app-api.stepsecurity.io:443
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Type check (mypy)
        run: mypy
      - name: Test (pytest)
        run: pytest -q
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-artifacts-${{ matrix.python }}
          path: |
            tests/__snapshots__/**
            tests/golden/__snapshots__/**
          if-no-files-found: ignore
          retention-days: 7
